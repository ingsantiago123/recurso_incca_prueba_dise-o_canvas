<style>
  body { margin: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #E2E6E9; }

<div class="info">
  Prueba: este es EXACTAMENTE el patrón que debe generar el plugin de Moodle — un
  <code>&lt;iframe&gt;</code> con el atributo <code>name</code> estático (JSON completo,
  sin ningún JavaScript en esta página) y <code>src</code> apuntando al visor V2. Curso de
  ejemplo: Ingeniería de Sistemas.
</div>

<!--
  Este es el HTML literal que debe producir el plugin: en PHP, se genera
  con json_encode($datos) y se imprime tal cual dentro del atributo name,
  entre comillas simples. No hace falta JavaScript en la página padre.
-->
<iframe id="incca-hero-section" title="Visor de recurso V2 UNINCCA"
  src="./index.html"
  name='{"curso":"Ingeniería de Sistemas","secciones":{"inicio":{"titulo_header":"ARQUITECTURA DE SOFTWARE Y DESARROLLO DE APLICACIONES","pregunta":"¿Cómo diseñamos sistemas de software que sigan siendo mantenibles, seguros y escalables incluso cuando el equipo, los datos y los usuarios crecen diez veces?","video":"https://www.youtube.com/watch?v=aqz-KE-bpKQ","recursos":[{"titulo":"NUESTRA PREGUNTA","resumen":"Por qué este módulo empieza con una pregunta y no con una definición.","cuerpo":["Antes de hablar de arquitecturas, patrones o lenguajes, este módulo te propone una pregunta incómoda: ¿qué hace que un sistema de software siga vivo, mantenible y seguro tres años después de escrito?","A lo largo de los cuatro ejes vas a construir tu propia respuesta, apoyado en ejercicios de código, lecturas y encuentros sincrónicos con tu docente."]},{"titulo":"LÍNEA DE TIEMPO DEL MÓDULO","resumen":"Cuatro ejes temáticos distribuidos en ocho semanas.","cuerpo":["Semana 1-2 · Eje 1: Fundamentos de programación y lógica computacional.","Semana 3-4 · Eje 2: Estructuras de datos y algoritmos.","Semana 5-6 · Eje 3: Arquitectura de software y bases de datos.","Semana 7-8 · Eje 4: Redes, seguridad y despliegue en la nube, seguido del cierre con el proyecto integrador."]},{"titulo":"CRITERIOS DE EVALUACIÓN","resumen":"Cómo se pondera cada entregable del módulo.","cuerpo":["30% ejercicios de código por eje temático.","30% proyecto integrador de cierre.","20% participación en tutorías sincrónicas y foros.","20% autoevaluación y coevaluación entre pares."]}]},"eje1":{"titulo_header":"FUNDAMENTOS DE PROGRAMACIÓN Y LÓGICA COMPUTACIONAL","pregunta":"¿Qué diferencia a un programa que simplemente funciona de uno que además es fácil de leer, probar y corregir por otra persona seis meses después?","video":"https://www.youtube.com/watch?v=eRsGyueVLvQ","recursos":[{"titulo":"VARIABLES, TIPOS Y CONTROL DE FLUJO","resumen":"Los bloques mínimos de todo programa.","cuerpo":["Repaso de tipos de datos primitivos, estructuras condicionales y ciclos, con ejercicios cortos autoevaluados.","Incluye una guía de buenas prácticas de nombramiento de variables y funciones."]},{"titulo":"FUNCIONES Y DESCOMPOSICIÓN DE PROBLEMAS","resumen":"Dividir un problema grande en piezas pequeñas y probables.","cuerpo":["Introducción a funciones puras, efectos secundarios y pruebas unitarias básicas.","Taller práctico: refactorizar un script de 80 líneas en funciones reutilizables."]}]},"eje2":{"titulo_header":"ESTRUCTURAS DE DATOS Y ALGORITMOS","pregunta":"Si dos soluciones dan el mismo resultado, ¿qué información necesitas para decidir cuál escalará mejor cuando los datos se multipliquen por mil?","video":"https://www.youtube.com/watch?v=aqz-KE-bpKQ","recursos":[{"titulo":"LISTAS, PILAS Y COLAS","resumen":"Cuándo usar cada estructura y por qué.","cuerpo":["Comparación práctica de listas enlazadas, pilas y colas con casos de uso reales en sistemas web.","Ejercicio: implementar una cola de tareas para un sistema de notificaciones."]},{"titulo":"COMPLEJIDAD ALGORÍTMICA (BIG O)","resumen":"Una forma de comparar algoritmos sin ejecutarlos.","cuerpo":["Introducción intuitiva a la notación Big O con ejemplos de búsqueda y ordenamiento.","Taller: medir y comparar el tiempo de ejecución de tres algoritmos de ordenamiento distintos."]},{"titulo":"ÁRBOLES Y GRAFOS","resumen":"Modelar relaciones jerárquicas y en red.","cuerpo":["Recorridos en árboles binarios y grafos, aplicados a problemas de rutas y jerarquías organizacionales."]}]},"eje3":{"titulo_header":"ARQUITECTURA DE SOFTWARE Y BASES DE DATOS","pregunta":"¿Qué decisiones de diseño tomadas en la primera semana de un proyecto son las más caras de revertir en el mes doce?","video":"https://www.youtube.com/watch?v=eRsGyueVLvQ","recursos":[{"titulo":"PATRONES DE DISEÑO ESENCIALES","resumen":"Soluciones probadas a problemas recurrentes.","cuerpo":["Repaso de los patrones MVC, Repository y Singleton, con ejemplos en un caso de estudio de una API educativa."]},{"titulo":"MODELADO DE BASES DE DATOS RELACIONALES","resumen":"Del diagrama entidad-relación a las tablas normalizadas.","cuerpo":["Taller guiado: modelar la base de datos de un sistema de matrículas universitario, desde el diagrama ER hasta la tercera forma normal."]}]},"eje4":{"titulo_header":"REDES, SEGURIDAD Y DESPLIEGUE EN LA NUBE","pregunta":"Cuando tu aplicación pasa de tu computador a producción, ¿qué capas de protección y monitoreo se vuelven no negociables?","video":"https://www.youtube.com/watch?v=aqz-KE-bpKQ","recursos":[{"titulo":"FUNDAMENTOS DE REDES Y PROTOCOLOS","resumen":"Cómo viajan los datos entre cliente y servidor.","cuerpo":["Repaso del modelo cliente-servidor, HTTP/HTTPS y APIs REST, con captura de tráfico en un entorno controlado."]},{"titulo":"SEGURIDAD INFORMÁTICA BÁSICA","resumen":"Los errores más comunes que abren la puerta a un ataque.","cuerpo":["Introducción a inyección SQL, XSS y buenas prácticas de manejo de credenciales, con ejercicios de detección en código real."]},{"titulo":"DESPLIEGUE Y CI/CD","resumen":"De tu editor de código a un servidor en producción.","cuerpo":["Taller práctico: configurar un pipeline de integración y despliegue continuo para una aplicación web sencilla."]}]},"cierre":{"titulo_header":"PROYECTO INTEGRADOR Y TENDENCIAS EMERGENTES","pregunta":"De todo lo construido en este módulo, ¿qué pieza defenderías frente a un equipo de trabajo real como tu mejor decisión técnica?","video":"https://www.youtube.com/watch?v=eRsGyueVLvQ","recursos":[{"titulo":"GUÍA DEL PROYECTO INTEGRADOR","resumen":"Los requisitos para el entregable final del módulo.","cuerpo":["Especificación del proyecto integrador: una aplicación web completa que combine los cuatro ejes trabajados durante el módulo.","Rúbrica de evaluación y fechas de sustentación ante el equipo docente."]},{"titulo":"TENDENCIAS EMERGENTES: IA, DEVOPS Y NUBE","resumen":"Hacia dónde mira la industria hoy.","cuerpo":["Panorama breve de inteligencia artificial aplicada al desarrollo de software, cultura DevOps y arquitecturas cloud-native.","Recomendaciones de rutas de profundización para después del módulo."]},{"titulo":"AUTOEVALUACIÓN Y CIERRE","resumen":"Un espacio para reconocer tu propio proceso.","cuerpo":["Cuestionario breve de autoevaluación y coevaluación entre pares, con espacio para comentarios abiertos sobre el módulo."]}]}}}'>
</iframe>
